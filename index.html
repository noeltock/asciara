<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<link rel=preconnect href="https://fonts.googleapis.com"><link rel=preconnect href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300&family=Geist+Pixel&display=swap" rel=stylesheet>
<title>asciara</title>
<style>html,body{margin:0;height:100%;background:#080808;overflow:hidden}canvas{display:block}</style>
<canvas></canvas><script src="assets/next/nx.js"></script><script>
// The landing composition. Everything the engine can do, in one field, at the settings that were
// arrived at by eye rather than by argument: a lit surface with folds and depth, contour glyphs
// where the form turns hardest, and the sub-glyph matte resolving the whole thing onto a fine
// lattice of cells that drift between light and dark.
//
// It is deliberately its own piece rather than a copy of one from the gallery — a landing page
// that duplicated another file would drift out of step with it the first time either was touched.
// Use the switcher at the top to move to any of the others.
const W = NX.warp;
NX({
  fps: 30,   // these fields drift slowly; 60 doubles the work for motion you cannot see
  matte: { mode: 'noise', cell: 3, depth: 0.26, bed: 0.26, bedSteps: 2, amp: 20, contrast: 0.50, speed: 0.06, wobble: 0.50 },
  layers: [{
    height(x, y){ return W(x, y, 1.72); },
    span: 1.42,
    bump: 2.05,
    light: [-0.52, -0.58, 0.62],
    contrast: 1.06,
    amb: 0.05, hgt: 0.10, dif: 0.58,
    spec: 0.12, shine: 14,          // a low exponent: a broad sheen on the crests, never a sparkle
    edges: 0.34, edgeBoost: 1.04, edgeLift: 0.10,   // contour glyphs where the surface bends hardest
    lineSmooth: 0.90, lineHyst: 0.60, vote: 1,
    dither: 1,
    drift: [-0.86, -0.30], driftSpeed: 0.040, evolve: 0.10,
    ink:      ["#1c1c1c", "#6c6c6c"],
    inkLight: ["#ececec", "#8a8a8a"]
  }]
});
</script>
