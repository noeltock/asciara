<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300&display=swap" rel=stylesheet>
<title>asciara — logo 3D (rotating)</title>
<style>html,body{margin:0;height:100%;background:#080808;overflow:hidden}canvas{display:block}</style>
<canvas></canvas><script src="engine.js"></script><script>
// logo 3D — the Accelerate triangle as a real extruded PRISM, rotating 360° about the vertical axis.
// Software 3D: a point cloud of the prism's surfaces is rotated about Y each frame, projected to the cell
// grid with a z-buffer (nearest face wins), and each face is shaded by how it now faces the light.
// Apex stays top, base stays bottom. Background is hero2's field; the logo clears a faded moat around itself.
const LIGHT = new URLSearchParams(location.search).has('light');
if (LIGHT) document.documentElement.style.background = document.body.style.background = "#fbfbfb";
const F = ASCIARA.fbm, HASH = ASCIARA.hash;
const ACC = ["Δ","%","A","C",">","<","="];
const SPIN_SECONDS = 20;            // one full turn
const STROKE = 26, DEPTH = 0.16;    // bar thickness (SVG units) and prism half-depth (object units)

// --- object-space geometry: the triangle outline (outer tri minus inner tri, mitered = SHARP corners) ---
const TRI = [[184.158,79.95],[235.34,242.5],[29.1875,242.5]];   // apex, bottom-right, bottom-left
const pts = (() => {
  const xs=TRI.map(p=>p[0]), ys=TRI.map(p=>p[1]);
  const cx=(Math.min(...xs)+Math.max(...xs))/2, cy=(Math.min(...ys)+Math.max(...ys))/2;
  const sc = 1/((Math.max(...xs)-Math.min(...xs))/2);
  const V = TRI.map(p=>[ (p[0]-cx)*sc, -(p[1]-cy)*sc ]);         // centred, y-up
  const cen=[(V[0][0]+V[1][0]+V[2][0])/3,(V[0][1]+V[1][1]+V[2][1])/3];
  const hw = STROKE*sc*0.5, hd = DEPTH, step = 0.016, out = [];

  function outN(S,E){ let p=[-(E[1]-S[1]), E[0]-S[0]]; const m=Math.hypot(p[0],p[1]); p=[p[0]/m,p[1]/m];
    const mid=[(S[0]+E[0])/2-cen[0],(S[1]+E[1])/2-cen[1]]; if (p[0]*mid[0]+p[1]*mid[1]<0){p=[-p[0],-p[1]];} return p; }
  function inter(a,u,b,v){ const den=u[0]*v[1]-u[1]*v[0];        // line a+su  vs  b+wv
    const w=((b[0]-a[0])*u[1]-(b[1]-a[1])*u[0])/den; return [b[0]+w*v[0], b[1]+w*v[1]]; }
  function offset(d){                                            // miter-offset the triangle by d (sharp corners)
    return V.map((M,i)=>{ const S1=V[(i+2)%3], S2=V[(i+1)%3];
      const n1=outN(S1,M), n2=outN(M,S2);
      const u=[M[0]-S1[0],M[1]-S1[1]], v=[S2[0]-M[0],S2[1]-M[1]];
      return inter([M[0]+n1[0]*d,M[1]+n1[1]*d],u, [M[0]+n2[0]*d,M[1]+n2[1]*d],v); });
  }
  const OUT=offset(hw), INN=offset(-hw);
  const side=(A,B,C)=>{ const s=(P)=>(B[0]-A[0])*(P[1]-A[1])-(B[1]-A[1])*(P[0]-A[0]); return s(C)>=0?1:-1; };
  function inside(P, T){ const s0=side(T[0],T[1],P), s1=side(T[1],T[2],P), s2=side(T[2],T[0],P);
    return (s0>=0&&s1>=0&&s2>=0)||(s0<=0&&s1<=0&&s2<=0); }
  // stable glyph id from OBJECT position -> a patch keeps its character as the prism rotates (no crawl)
  function gi(x,y,z){ const h=Math.sin(x*51.3+y*97.1+z*41.7)*43758.5; return ((h-Math.floor(h))*ACC.length)|0; }

  // FRONT & BACK faces: grid over the outer-triangle bbox, keep cells in OUT but not in INN
  const ox=OUT.map(p=>p[0]), oy=OUT.map(p=>p[1]);
  for (let x=Math.min(...ox); x<=Math.max(...ox); x+=step)
    for (let y=Math.min(...oy); y<=Math.max(...oy); y+=step)
      if (inside([x,y],OUT) && !inside([x,y],INN)){ out.push(x,y,+hd, 0,0,1, gi(x,y,+hd)); out.push(x,y,-hd, 0,0,-1, gi(x,y,-hd)); }

  // SIDE WALLS: along the outer edges (outward normal) and the inner edges (inward normal), spanning depth
  function wall(T, outward){
    for (let e=0;e<3;e++){ const A=T[e], B=T[(e+1)%3]; const len=Math.hypot(B[0]-A[0],B[1]-A[1]);
      const dx=(B[0]-A[0])/len, dy=(B[1]-A[1])/len; let nx=-dy, ny=dx;
      const mid=[(A[0]+B[0])/2-cen[0],(A[1]+B[1])/2-cen[1]]; const o=(nx*mid[0]+ny*mid[1]>=0)?1:-1;
      nx*= o*outward; ny*= o*outward;
      const nL=Math.ceil(len/step);
      for (let i=0;i<=nL;i++){ const t=i/nL, bx=A[0]+dx*len*t, by=A[1]+dy*len*t;
        for (let z=-hd; z<=hd; z+=step) out.push(bx,by,z, nx,ny,0, gi(bx,by,z)); }
    }
  }
  wall(OUT, 1); wall(INN, -1);
  return new Float32Array(out);
})();

const L3 = (()=>{ const l=[-0.45,0.5,0.80], m=Math.hypot(...l); return [l[0]/m,l[1]/m,l[2]/m]; })(); // light, y-up

// --- background = hero2 lit field ---
const SPAN=1.5,BUMP=1.9,CONTRAST=1.05;
const LV=(()=>{const l=[-0.5,-0.6,0.62],m=Math.hypot(...l);return[l[0]/m,l[1]/m,l[2]/m];})();
const FLOW=[-0.85,-0.32],FLOWSPEED=0.05,EVOLVE=0.12;
function height(x,y){const qx=F(x,y),qy=F(x+5.2,y+1.3);const rx=F(x+1.6*qx+1.7,y+1.6*qy+9.2),ry=F(x+1.6*qx+8.3,y+1.6*qy+2.8);return F(x+1.8*rx,y+1.8*ry);}

let Hg=null, occ=null, glb=null, glc=null, cg=null, sglb=null, pocc=null, zbf=null, clr=null, tmpA=null, tmpB=null, C2=0, R2=0;
function maxfilt(src,dst,cols,rows,rad){
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let m=0;for(let k=-rad;k<=rad;k++){const xx=x+k;if(xx>=0&&xx<cols)m=Math.max(m,src[y*cols+xx]);}tmpA[y*cols+x]=m;}
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let m=0;for(let k=-rad;k<=rad;k++){const yy=y+k;if(yy>=0&&yy<rows)m=Math.max(m,tmpA[yy*cols+x]);}dst[y*cols+x]=m;}
}
function boxblur(buf,cols,rows,rad){
  const inv=1/(2*rad+1);
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let s=0;for(let k=-rad;k<=rad;k++){const xx=Math.min(cols-1,Math.max(0,x+k));s+=buf[y*cols+xx];}tmpB[y*cols+x]=s*inv;}
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let s=0;for(let k=-rad;k<=rad;k++){const yy=Math.min(rows-1,Math.max(0,y+k));s+=tmpB[yy*cols+x];}buf[y*cols+x]=s*inv;}
}

ASCIARA({
  fps: 30,
  bg: LIGHT ? "#fbfbfb" : "#080808",
  ink: LIGHT ? ["#ececec", "#9a9a9a"] : ["#161616", "#707070"],   // field = hero2 band
  overlay: LIGHT ? ["#c8c8c8", "#101010"] : ["#343434", "#ffffff"], // logo band [shadow, lit]
  resize(cols, rows){ const N=cols*rows; C2=cols;R2=rows;
    Hg=new Float32Array(N); occ=new Float32Array(N); glb=new Float32Array(N); glc=new Int8Array(N); zbf=new Float32Array(N);
    cg=new Int8Array(N); sglb=new Float32Array(N); pocc=new Float32Array(N); clr=new Float32Array(N); tmpA=new Float32Array(N); tmpB=new Float32Array(N); },
  compute(buf, cols, rows, t, ov){
    const N=cols*rows;
    // 1) background field (hero2)
    const dx=FLOW[0]*FLOWSPEED*t+0.4*Math.cos(t*EVOLVE), dy=FLOW[1]*FLOWSPEED*t+0.4*Math.sin(t*EVOLVE);
    const scale=SPAN/cols;
    for(let y=0;y<rows;y++)for(let x=0;x<cols;x++) Hg[y*cols+x]=height(x*scale+dx,y*scale*2.0+dy);

    // 2) rotate the prism about Y, project, z-buffer the nearest face per cell
    occ.fill(0); zbf.fill(-1e9);
    const ang = 2*Math.PI*(t % SPIN_SECONDS)/SPIN_SECONDS, ca=Math.cos(ang), sa=Math.sin(ang);
    const SX=0.21*cols, SY=0.21*cols*0.5, cxp=cols/2, cyp=rows/2;   // project (SY halved for 2:1 cells)
    for(let p=0;p<pts.length;p+=7){
      const x=pts[p],y=pts[p+1],z=pts[p+2], nx=pts[p+3],ny=pts[p+4],nz=pts[p+5];
      const rnz=-nx*sa+nz*ca;                            // rotated normal z (toward camera = +)
      if(rnz < -0.04) continue;                          // BACKFACE CULL -> front & back stop z-fighting
      const rx=x*ca+z*sa, rz=-x*sa+z*ca + rnz*0.012;     // rotate point (+ tiny bias toward camera-facing)
      const sxp=(cxp+rx*SX)|0, syp=(cyp-y*SY)|0;
      if(sxp<0||sxp>=cols||syp<0||syp>=rows) continue;
      const i=syp*cols+sxp;
      if(rz>zbf[i]){
        zbf[i]=rz;
        const rnx=nx*ca+nz*sa, diff=Math.max(0, rnx*L3[0]+ny*L3[1]+rnz*L3[2]);
        occ[i]=1; glb[i]=0.12+0.88*diff; glc[i]=pts[p+6]; // brightness + STABLE glyph id from object space
      }
    }

    // 3) moat: dilate the occupancy a couple cells (empty ring), blur for the fade
    maxfilt(occ, clr, cols, rows, 2);
    boxblur(clr, cols, rows, Math.max(3, Math.round(cols*0.05)));
    for(let i=0;i<N;i++) clr[i]=Math.min(1, clr[i]*1.7);

    // 4) compose: field faded by the moat, then the shaded rotating logo on top
    const inv2s=1/(2*scale);
    for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
      const i=y*cols+x;
      const xm=x>0?x-1:x,xp=x<cols-1?x+1:x,ym=y>0?y-1:y,yp=y<rows-1?y+1:y;
      const hh=Hg[i];
      const hx=(Hg[y*cols+xp]-Hg[y*cols+xm])*inv2s*(xp!==xm?1:2), hy=(Hg[yp*cols+x]-Hg[ym*cols+x])*inv2s*(yp!==ym?1:2);
      const bx=-BUMP*hx, by=-BUMP*hy, nl=Math.hypot(bx,by,1);
      let s=0.08+0.10*hh+0.92*Math.max(0,(bx*LV[0]+by*LV[1]+LV[2])/nl); s=(s-0.5)*CONTRAST+0.5; s=s<0?0:s>1?1:s;
      buf[i]=s*(1-clr[i]);
      if(occ[i]){
        if(!pocc[i]) cg[i]=glc[i];                               // assign a glyph ONLY when a cell newly appears...
        sglb[i] = pocc[i] ? sglb[i]*0.5 + glb[i]*0.5 : glb[i];   // ...so the rotation is carried by BRIGHTNESS, not churn
        ov[i]={ c: ACC[cg[i]], b: sglb[i] };
      }
      pocc[i]=occ[i];
    }
  }
});
</script>
