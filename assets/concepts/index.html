<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400&display=swap" rel=stylesheet>
<title>asciara — backgrounds</title>
<style>
  html,body{ margin:0; min-height:100%; background:#080808; color:#cfcfcf;
    font-family:"Geist Mono",monospace; font-weight:300; }
  .wrap{ max-width:680px; margin:0 auto; padding:72px 28px 90px; }
  h1{ font-weight:300; letter-spacing:12px; font-size:24px; margin:0 0 6px; color:#f0f0f0; }
  .sub{ color:#7d7d7d; font-size:13px; letter-spacing:2px; margin:0 0 52px; }
  .piece{ padding:22px 0; border-bottom:1px solid #161616; }
  .name{ font-size:20px; letter-spacing:2px; color:#eaeaea; }
  .desc{ color:#7d7d7d; font-size:13px; margin:6px 0 14px; }
  .modes a{ text-decoration:none; color:#bdbdbd; font-size:13px; letter-spacing:2px;
    border:1px solid #2a2a2a; padding:7px 16px; margin-right:10px; transition:.15s; display:inline-block; }
  .modes a:hover{ color:#fff; border-color:#555; background:#101010; }
  footer{ color:#555; font-size:12px; letter-spacing:1px; margin-top:48px; }
</style>
<div class="wrap">
  <h1>asciara</h1>
  <p class="sub">four living backgrounds · subtle, organic, slow · dark and light</p>
  <div id="root"></div>
  <footer>each opens full-screen · the value-band (ink) is the subtlety dial · Geist Mono Light</footer>
</div>
<script>
  const pieces = [
    ["hero2",    "../hero2.html",  "the lit, flowing surface — folds and depth, the signature"],
    ["dissolve", "dissolve.html",  "Accelerate logo as a static isometric 3D prism in the field"],
    ["logo-3d",  "logo-3d.html",   "the logo prism rotating 360° about its vertical axis"],
    ["contours", "contours.html",  "slow topographic ridge lines, morphing"]
  ];
  const root = document.getElementById('root');
  for (const [name, href, desc] of pieces){
    const p = document.createElement('div'); p.className = 'piece';
    p.innerHTML =
      '<div class="name">' + name + '</div>' +
      '<div class="desc">' + desc + '</div>' +
      '<div class="modes">' +
        '<a href="' + href + '" target="_blank" rel="noopener">dark &rarr;</a>' +
        '<a href="' + href + (href.includes('?') ? '&' : '?') + 'light" target="_blank" rel="noopener">light &rarr;</a>' +
      '</div>';
    root.appendChild(p);
  }
</script>
