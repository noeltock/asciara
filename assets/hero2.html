<!DOCTYPE html>
<!--
  ASCII hero 2 — a LIT, FLOWING SURFACE (not a flat wave texture). A domain-warped fBm height
  field is shaded by its own surface normals against a light direction, then mapped smoothly
  through the full ramp — so you read folds, billows and depth. Greyscale, seamless loop
  (the field drifts around a circle in time), canvas, no dependencies.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #080808; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const LIGHT = new URLSearchParams(location.search).has('light');  // add ?light to the URL for light mode
const CONFIG = {
  ramp: " .:;/<>=?*T%&#@N",  // web/code symbols + N T, coverage-ordered light -> dense
  fontSize: 15,
  fontFamily: "'Geist Mono','JetBrains Mono',Menlo,monospace",
  fontWeight: 300,            // Geist Mono Light
  pad: 2,                     // px gap added around each glyph cell (breathing room / finer mesh)
  span: 1.5,                  // smaller = bigger forms (macro). try 1.1 - 2.0
  bump: 1.9,                  // relief strength (lower = subtler)
  light: [-0.5, -0.6, 0.62],  // light direction (upper-left, toward viewer)
  contrast: 1.05,             // lower = subtler tonal range
  bg: LIGHT ? "#fbfbfb" : "#080808",
  ink: LIGHT ? ["#ececec", "#9a9a9a"] : ["#161616", "#707070"], // [faint, dense] band; ?light flips it to grey-on-white

  levels: 12,                 // grey buckets when shading

  // --- LEVERS ---
  shading: true,              // true = graded shades of grey (depth); false = monochrome (form via glyphs only)
  mono: "#cfcfcf",            // glyph colour used when shading:false
  fps: 60,                    // redraw rate: 60 = smooth; 8-12 = stepped, old-terminal cadence

  flow: [-0.85, -0.32],       // the surface drifts in this direction
  flowSpeed: 0.05,            // drift speed — lower = more subtle
  evolve: 0.12                // gentle internal meander on top of the drift
};
if (LIGHT) document.documentElement.style.background = document.body.style.background = CONFIG.bg;

// --- fast integer-hash value noise + fBm ---
function hash(ix, iy){
  let h = (ix|0)*374761393 + (iy|0)*668265263;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) >>> 0) / 4294967295;
}
function sm(t){ return t*t*t*(t*(t*6-15)+10); }
function noise(x, y){
  const ix = Math.floor(x), iy = Math.floor(y), fx = x-ix, fy = y-iy;
  const u = sm(fx), v = sm(fy);
  const a = hash(ix,iy), b = hash(ix+1,iy), c = hash(ix,iy+1), d = hash(ix+1,iy+1);
  return (a*(1-u)+b*u)*(1-v) + (c*(1-u)+d*u)*v;
}
function fbm(x, y){
  let s = 0, amp = 0.55, f = 1.0;
  for (let o = 0; o < 4; o++){ s += amp * noise(x*f, y*f); f *= 2; amp *= 0.5; }
  return s;
}
function height(x, y){
  const qx = fbm(x, y),                        qy = fbm(x+5.2, y+1.3);
  const rx = fbm(x+1.6*qx+1.7, y+1.6*qy+9.2),  ry = fbm(x+1.6*qx+8.3, y+1.6*qy+2.8);
  return fbm(x+1.8*rx, y+1.8*ry);
}

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let cols, rows, adv, lineH, H;
function fit(){
  const dpr = window.devicePixelRatio || 1;
  const W = window.innerWidth, Hh = window.innerHeight;
  cv.style.width = W + 'px'; cv.style.height = Hh + 'px';
  cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr);  // backing store at device res
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);                            // draw in CSS px, render sharp
  ctx.font = CONFIG.fontWeight + ' ' + CONFIG.fontSize + 'px ' + CONFIG.fontFamily;
  ctx.textBaseline = 'top';
  adv = ctx.measureText('M').width + CONFIG.pad; lineH = CONFIG.fontSize * 1.06 + CONFIG.pad;
  cols = Math.min(190, Math.ceil(W / adv)); rows = Math.ceil(Hh / lineH);
  H = new Float32Array(cols * rows);
}
window.addEventListener('resize', fit); fit();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);  // re-fit once Geist Mono loads

const L = (() => { const l = CONFIG.light, m = Math.hypot(l[0],l[1],l[2]); return [l[0]/m,l[1]/m,l[2]/m]; })();
function hexrgb(h){ h = h.replace('#',''); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; }
const inkLo = hexrgb(CONFIG.ink[0]), inkHi = hexrgb(CONFIG.ink[1]);
function greyCss(b){            // interpolate within the ink band -> the subtlety dial
  const r = Math.round(inkLo[0] + (inkHi[0]-inkLo[0])*b),
        g = Math.round(inkLo[1] + (inkHi[1]-inkLo[1])*b),
        bl= Math.round(inkLo[2] + (inkHi[2]-inkLo[2])*b);
  return `rgb(${r},${g},${bl})`;
}

function draw(now){
  const t = now/1000;
  // directional drift (the surface flows) + a gentle internal meander
  const dx = CONFIG.flow[0]*CONFIG.flowSpeed*t + 0.4*Math.cos(t*CONFIG.evolve);
  const dy = CONFIG.flow[1]*CONFIG.flowSpeed*t + 0.4*Math.sin(t*CONFIG.evolve);
  const scale = CONFIG.span / cols, ramp = CONFIG.ramp, n = ramp.length-1, Lc = CONFIG.levels;
  const shading = CONFIG.shading;

  // pass 1: drifting height grid
  for (let y = 0; y < rows; y++)
    for (let x = 0; x < cols; x++)
      H[y*cols+x] = height(x*scale + dx, y*scale*2.0 + dy);

  // pass 2: shade from surface normals (grid neighbours)
  ctx.fillStyle = CONFIG.bg; ctx.fillRect(0,0,window.innerWidth,window.innerHeight);
  const inv2s = 1/(2*scale);
  const buckets = shading ? Array.from({length:Lc}, ()=>[]) : null;
  const flat = shading ? null : [];
  for (let y = 0; y < rows; y++){
    for (let x = 0; x < cols; x++){
      const xm = x>0?x-1:x, xp = x<cols-1?x+1:x, ym = y>0?y-1:y, yp = y<rows-1?y+1:y;
      const h = H[y*cols+x];
      const hx = (H[y*cols+xp]-H[y*cols+xm]) * inv2s * (xp!==xm?1:2);
      const hy = (H[yp*cols+x]-H[ym*cols+x]) * inv2s * (yp!==ym?1:2);
      const bx = -CONFIG.bump*hx, by = -CONFIG.bump*hy;
      const nl = Math.hypot(bx, by, 1);
      let diff = (bx*L[0] + by*L[1] + L[2]) / nl; if (diff < 0) diff = 0;
      let s = 0.08 + 0.10*h + 0.92*diff;
      s = (s-0.5)*CONFIG.contrast + 0.5;
      s = s < 0 ? 0 : s > 1 ? 1 : s;
      const ci = Math.min(n, (s*(n+1))|0);
      if (ci === 0) continue;
      if (shading){ const lvl = Math.min(Lc-1, (s*Lc)|0); buckets[lvl].push(ramp[ci], x*adv, y*lineH); }
      else flat.push(ramp[ci], x*adv, y*lineH);
    }
  }
  if (shading){
    for (let l = 0; l < Lc; l++){
      const arr = buckets[l]; if (!arr.length) continue;
      ctx.fillStyle = greyCss((l+0.5)/Lc);
      for (let i = 0; i < arr.length; i += 3) ctx.fillText(arr[i], arr[i+1], arr[i+2]);
    }
  } else {
    ctx.fillStyle = CONFIG.mono;
    for (let i = 0; i < flat.length; i += 3) ctx.fillText(flat[i], flat[i+1], flat[i+2]);
  }
}

let last = -1e9;
function loop(now){
  requestAnimationFrame(loop);
  if (now - last < 1000/Math.max(1, CONFIG.fps)) return;   // throttle -> old-terminal cadence at low fps
  last = now; draw(now);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
