<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300&display=swap" rel=stylesheet>
<title>asciara — ridge</title>
<style>html,body{margin:0;height:100%;background:#080808;overflow:hidden}canvas{display:block}</style>
<canvas></canvas><script src="nx.js"></script><script>
// ridge — contour channel over a field of DRIFTING EDDIES.
// Waves were the wrong host for this. A sine field has near-constant gradient magnitude, so a
// contour test fires everywhere at once and comes out as a uniform diagonal hatch. Eddies vary:
// the field is a streamfunction — a sum of soft rotating vortices that wander and pass through
// each other — so its gradient is strong at the shear lines between them and weak in their
// centres. The contour glyphs then land only where the flow is actually turning, and because
// the iso-lines of a streamfunction ARE the streamlines, the lines you see are the current.
const F = NX.fbm;
const NV = 8, V = [];
for (let i = 0; i < NV; i++) V.push({
  x: NX.hash(i*7+1, 3), y: NX.hash(i*13+5, 11),          // home position, 0..1 of the frame
  s: (NX.hash(i*3+2, 17) < 0.5 ? -1 : 1) * (0.6 + 0.8*NX.hash(i*5, 23)),   // spin, both ways
  r: 0.10 + 0.16*NX.hash(i*11, 29),                       // radius
  a: 0.05 + 0.09*NX.hash(i*17, 31), b: 0.04 + 0.08*NX.hash(i*19, 37),      // wander amplitude
  p: 6.28*NX.hash(i*23, 41), q: 6.28*NX.hash(i*29, 43),   // wander phase
  w: 0.016 + 0.018*NX.hash(i*31, 47)                        // wander rate — slow
});
NX({ fps: 30, matte: { mode: 'noise', cell: 3, depth: 0.26, bed: 0.26, bedSteps: 2, amp: 20, contrast: 0.50, speed: 0.06, wobble: 0.50 }, layers: [{
  gridSpace: true,
  heightGrid(H, cols, rows, t){
    for (const v of V){ v.cx = v.x + v.a*Math.sin(t*v.w + v.p); v.cy = v.y + v.b*Math.cos(t*v.w*1.3 + v.q); }
    for (let y = 0; y < rows; y++){
      const fy = y/rows;
      for (let x = 0; x < cols; x++){
        const fx = x/cols;
        let psi = 0;
        for (const v of V){
          const dx = (fx - v.cx)*1.6, dy = fy - v.cy;      // 1.6 widens x so eddies read round
          psi += v.s * Math.exp(-(dx*dx + dy*dy)/(2*v.r*v.r));
        }
        H[y*cols+x] = 0.5 + 0.30*psi + 0.10*F(x*0.16 + t*0.013, y*0.16);
      }
    }
  },
  bump: 26, contrast: 1.34, amb: 0.05, dif: 0.56, hgt: 0.10,
  dither: 1, vote: 1,
  edges: 0.40, edgeBoost: 1.02, edgeLift: 0.08,
  lineSmooth: 0.90, lineHyst: 0.58,
  ink: NX.LIGHT ? ["#ececec","#8a8a8a"] : ["#1c1c1c","#6c6c6c"],
}]});
</script>
