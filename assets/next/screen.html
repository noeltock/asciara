<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300&display=swap" rel=stylesheet>
<title>asciara — screen</title>
<style>html,body{margin:0;height:100%;background:#080808;overflow:hidden}canvas{display:block}</style>
<canvas></canvas><script src="nx.js"></script><script>
// screen — one ruled plane against two layers of value-keyed grain.
// The middle band is intentionally regular while the planes around it stay atmospheric: changing
// the material on one element creates depth; screening the whole frame would flatten it again.
const F = NX.fbm;
NX({ fps: 30,
  matte: { mode: 'noise', cell: 3, depth: 0.26, bed: 0.26, bedSteps: 5, amp: 32,
           contrast: 0.42, speed: 0.04, wobble: 0.42, curve: 'bell', floor: 0.25 },
  layers: [
  { // far — a broad, quiet field whose grain thins at both ends of the ramp
    gridSpace: true,
    heightGrid(H, cols, rows, t){
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++)
        H[y*cols+x] = 0.50 + 0.25*Math.sin(x*0.025 + y*0.018 - t*0.025)
                         + 0.08*F(x*0.08 + t*0.006, y*0.08);
    },
    // the ground is LIFTED into the mid-range on purpose: bell puts its grain where the field
    // sits around a half, so a black ground gets nothing and reads as a flat page. A mid-value
    // ground is where the atmosphere lives; the middle band keeps the one hard edge.
    // Its INK is nearly the page colour, though: a mid-value field drawn in full ink is a solid
    // sheet of glyphs that buries everything in front of it. The tone comes from the bed.
    bump: 17, contrast: 1.00, gamma: 1.2, amb: 0.30, dif: 0.30, hgt: 0.10,
    dither: 1,
    ink: NX.LIGHT ? ["#f4f4f4","#d8d8d8"] : ["#0c0c0c","#242424"] },
  { // middle — horizontal rules make this one plane feel manufactured
    matte: { mode: 'screen', pitch: 4, angle: 0, duty: 0.5 },
    gridSpace: true,
    heightGrid(H, cols, rows, t){
      const cy = rows*0.47;
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++){
        const band = Math.exp(-Math.pow((y-cy)/(rows*0.15), 2));
        H[y*cols+x] = 0.42 + 0.46*band*(0.72 + 0.28*Math.sin(x*0.042 - t*0.035));
      }
    },
    // the ONE hard edge: this plane is allowed to blow out to near-white against the mid ground
    bump: 23, contrast: 1.28, gamma: 1.45, amb: 0.03, dif: 0.42, hgt: 0.10,
    dither: 1,
    ink: NX.LIGHT ? ["#c8c8c8","#101010"] : ["#2a2a2a","#f0f0f0"] },
  { // near — sparse moving crests return to irregular grain
    gridSpace: true,
    heightGrid(H, cols, rows, t){
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++){
        const w = Math.sin(x*0.032 + y*0.024 - t*0.068 + 1.3);
        H[y*cols+x] = 0.47 + 0.38*Math.pow(Math.max(0, w), 2.5)
                          + 0.07*F(x*0.11 + t*0.012, y*0.11);
      }
    },
    // gamma is high so this layer is only its crests: the composite gives a cell to the
    // frontmost layer with any ink, so a dense near plane hides the ground entirely.
    bump: 27, contrast: 1.30, gamma: 3.2, amb: 0.02, dif: 0.52, hgt: 0.08,
    dither: 1, spec: 0.10, shine: 12,
    ink: NX.LIGHT ? ["#ececec","#8a8a8a"] : ["#1c1c1c","#6c6c6c"] }
]});
</script>
