<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300&display=swap" rel=stylesheet>
<title>asciara — strata</title>
<style>html,body{margin:0;height:100%;background:#080808;overflow:hidden}canvas{display:block}</style>
<canvas></canvas><script src="nx.js"></script><script>
// strata — parallax depth, with a DIFFERENT MOTION AT EACH DISTANCE.
// Three surfaces back to front. Stacking three copies of one motion just thickens it; what
// makes distance legible is that far things move differently from near things, not merely
// slower. So: the far plane breathes (a long swell whose amplitude rises and falls), the middle
// plane gusts sideways, and the near plane is a slow train of crests. Separation is by value
// and scale only — no occlusion rectangles, no cutoffs, nothing with a hard edge.
const F = NX.fbm;
NX({ fps: 30, matte: { mode: 'noise', cell: 3, depth: 0.26, bed: 0.26, bedSteps: 2, amp: 20, contrast: 0.50, speed: 0.06, wobble: 0.50 }, layers: [
  { // far — breathing. Long wavelength, dim, and it barely moves.
    gridSpace: true,
    heightGrid(H, cols, rows, t){
      const breath = 0.5 + 0.5*Math.sin(t*0.032);
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++)
        H[y*cols+x] = 0.5 + (0.14 + 0.26*breath)*Math.sin((x*0.030 + y*0.020) - t*0.035)
                          + 0.10*F(x*0.09 + t*0.005, y*0.09);
    },
    bump: 17, contrast: 1.16, gamma: 3.2, amb: 0.01, dif: 0.20, hgt: 0.07,
    dither: 1,
    ink: NX.LIGHT ? ["#ececec","#8a8a8a"] : ["#1c1c1c","#6c6c6c"] },
  { // mid — gusting sideways
    gridSpace: true,
    heightGrid(H, cols, rows, t){
      for (let y = 0; y < rows; y++){
        const g = 0.5 + 0.7*F(y/rows*2.2 + t*0.020, 4.7);
        for (let x = 0; x < cols; x++)
          H[y*cols+x] = 0.5 + 0.30*(F(x*0.070 - t*g*0.18, y*0.105) - 0.5) + 0.14*Math.sin(x*0.05 + y*0.03 - t*0.062);
      }
    },
    bump: 24, contrast: 1.30, gamma: 1.7, amb: 0.03, dif: 0.38, hgt: 0.10,
    dither: 1,
    ink: NX.LIGHT ? ["#ececec","#8a8a8a"] : ["#1c1c1c","#6c6c6c"], },
  { // near — a slow train of crests, rectified so the troughs stay dark and it reads as sparse
    gridSpace: true,
    heightGrid(H, cols, rows, t){
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++){
        const w = Math.sin((x*0.030 + y*0.022) - t*0.082 + 0.9);
        H[y*cols+x] = 0.5 + 0.40*Math.pow(Math.max(0, w), 2.4) + 0.09*F(x*0.10 + t*0.017, y*0.10);
      }
    },
    bump: 27, contrast: 1.34, gamma: 1.15, amb: 0.02, dif: 0.56, hgt: 0.09,
    dither: 1,
    spec: 0.16, shine: 11,
    ink: NX.LIGHT ? ["#ececec","#8a8a8a"] : ["#1c1c1c","#6c6c6c"] }
]});
</script>
