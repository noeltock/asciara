<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPUAscii smoke test</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #080808; }
    canvas { width: 100%; height: 100%; display: block; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { GPUAscii } from './gpuascii.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#080808');

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 5.2);

    const knot = new THREE.Mesh(
      new THREE.TorusKnotGeometry(1.35, 0.42, 180, 32),
      new THREE.MeshStandardMaterial({ color: '#d9d9d9', metalness: 0.12, roughness: 0.42 })
    );
    scene.add(knot);

    scene.add(new THREE.HemisphereLight('#ffffff', '#101010', 1.4));
    const key = new THREE.DirectionalLight('#ffffff', 2.5);
    key.position.set(3, 2, 4);
    scene.add(key);

    const ascii = new GPUAscii({
      scene,
      camera,
      onResize: ({ width, height }) => {
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
      }
    });
    await ascii.ready;

    function frame(now) {
      knot.rotation.x = now * 0.00019;
      knot.rotation.y = now * 0.00027;
      ascii.render();
      if (!ascii.prefersReducedMotion) requestAnimationFrame(frame);
    }

    ascii.render();
    if (!ascii.prefersReducedMotion) requestAnimationFrame(frame);
  </script>
</body>
</html>
