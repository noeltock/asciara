<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300&display=swap" rel=stylesheet>
<title>asciara — ridge</title>
<style>html,body{margin:0;height:100%;background:#080808;overflow:hidden}canvas{display:block}</style>
<canvas></canvas><script src="gl.js"></script><script>
const F = GL.fbm;
const NV = 8, V = [];
for (let i = 0; i < NV; i++) V.push({
  x: GL.hash(i*7+1, 3), y: GL.hash(i*13+5, 11),
  s: (GL.hash(i*3+2, 17) < 0.5 ? -1 : 1) * (0.6 + 0.8*GL.hash(i*5, 23)),
  r: 0.10 + 0.16*GL.hash(i*11, 29), a: 0.05 + 0.09*GL.hash(i*17, 31), b: 0.04 + 0.08*GL.hash(i*19, 37),
  p: 6.28*GL.hash(i*23, 41), q: 6.28*GL.hash(i*29, 43), w: 0.016 + 0.018*GL.hash(i*31, 47)
});
GL({ fps: 30, matte: { mode: 'noise', cell: 3, depth: 0.26, bed: 0.26, bedSteps: 2, amp: 20, contrast: 0.50, speed: 0.06, wobble: 0.50 }, layers: [{
  gridSpace: true,
  heightGrid(H, cols, rows, t){
    for (const v of V){ v.cx = v.x + v.a*Math.sin(t*v.w + v.p); v.cy = v.y + v.b*Math.cos(t*v.w*1.3 + v.q); }
    for (let y = 0; y < rows; y++){
      const fy = y/rows;
      for (let x = 0; x < cols; x++){
        const fx = x/cols; let psi = 0;
        for (const v of V){ const dx = (fx - v.cx)*1.6, dy = fy - v.cy; psi += v.s * Math.exp(-(dx*dx + dy*dy)/(2*v.r*v.r)); }
        H[y*cols+x] = 0.5 + 0.30*psi + 0.10*F(x*0.16 + t*0.013, y*0.16);
      }
    }
  },
  bump: 26, contrast: 1.34, amb: 0.05, dif: 0.56, hgt: 0.10,
  dither: 1, vote: 1, edges: 0.40, edgeBoost: 1.02, edgeLift: 0.08,
  lineSmooth: 0.90, lineHyst: 0.58,
  ink: GL.LIGHT ? ["#ececec","#8a8a8a"] : ["#1c1c1c","#6c6c6c"]
}]});
</script>
