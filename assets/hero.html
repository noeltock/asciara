<!DOCTYPE html>
<!--
  Self-contained ASCII hero: a calm, seamlessly-looping flow field rendered as monospace text.
  No dependencies. Drop into any page; tune the CONFIG block. The loop is seamless because the
  noise field is sampled along a circle in time (period = LOOP_SECONDS).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #050505; }
  #ascii {
    margin: 0; font-family: "Iosevka", "JetBrains Mono", "Menlo", monospace;
    line-height: 1.0; letter-spacing: 0; white-space: pre; color: #cfcfcf;
    background: #0a0a0a; user-select: none;
    display: flex; align-items: center; justify-content: center;
    height: 100vh; font-size: 14px;
  }
</style>
</head>
<body>
<pre id="ascii" aria-hidden="true"></pre>
<script>
const CONFIG = {
  ramp: " .·:-=",     // light -> dense; sparse set reads calm
  cell: 14,                  // px; larger = coarser = more soul
  density: 0.45,             // 0..1 how much of the field is "lit"
  warp: 0.18,                // domain-warp amount (organic drift)
  loopSeconds: 18,           // seamless loop length
  scale: 6.0                 // spatial frequency of the field
};

// --- hash value-noise (seamless via circular time warp) ---
function rand(ix, iy){ const s = Math.sin(ix*127.1 + iy*311.7) * 43758.5453; return s - Math.floor(s); }
function smoother(t){ return t*t*t*(t*(t*6-15)+10); }
function noise(x, y){
  const ix = Math.floor(x), iy = Math.floor(y), fx = x-ix, fy = y-iy;
  const u = smoother(fx), v = smoother(fy);
  const a = rand(ix,iy), b = rand(ix+1,iy), c = rand(ix,iy+1), d = rand(ix+1,iy+1);
  return (a*(1-u)+b*u)*(1-v) + (c*(1-u)+d*u)*v;
}

const pre = document.getElementById('ascii');
let cols = 0, rows = 0;
function fit(){
  pre.style.fontSize = CONFIG.cell + 'px';
  cols = Math.floor(window.innerWidth / (CONFIG.cell * 0.6));
  rows = Math.floor(window.innerHeight / CONFIG.cell);
}
window.addEventListener('resize', fit); fit();

function frame(now){
  const t = 2*Math.PI * ((now/1000) % CONFIG.loopSeconds) / CONFIG.loopSeconds;
  const wx = CONFIG.warp * Math.cos(t), wy = CONFIG.warp * Math.sin(t);
  const ramp = CONFIG.ramp, n = ramp.length - 1, lines = [];
  for (let y = 0; y < rows; y++){
    let line = '';
    for (let x = 0; x < cols; x++){
      const nx = x / cols * CONFIG.scale, ny = y / rows * CONFIG.scale * (rows/cols) * 2;
      const a = noise(nx + 8*wx, ny + 8*wy);
      const b = noise(nx*2 + 16*wy, ny*2 - 16*wx);
      let f = 0.65*a + 0.35*b;
      f = Math.max(0, Math.min(1, (f - (1-CONFIG.density)) / CONFIG.density));
      line += ramp[Math.min(n, Math.floor(f * (n+1)))];
    }
    lines.push(line);
  }
  pre.textContent = lines.join('\n');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
